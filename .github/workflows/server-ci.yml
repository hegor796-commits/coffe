name: Backend CI (nutri/server)

# Прогоняет смоук-тесты мультитенант-бэкенда (nutri/server) при каждом
# изменении в этой папке. Бэкенд zero-dependency (node:http + node:sqlite),
# поэтому здесь нет ни pnpm, ни установки зависимостей — только сам Node.

on:
  push:
    paths:
      - 'nutri/server/**'
      - '.github/workflows/server-ci.yml'
  pull_request:
    paths:
      - 'nutri/server/**'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Синтаксис
        working-directory: nutri/server
        run: node --check src/server.js

      - name: Смоук-тесты (node --test)
        working-directory: nutri/server
        run: npm test
